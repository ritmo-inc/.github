name: "バグ修正・機能改修 (PBI)"
description: "今あるものが壊れとる・使いにくい時に使います"
labels: ["bug"]
projects: ["ritmo-inc/2"]
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 分かる範囲で埋めてもらえれば十分です。技術的な話は「やり方の指定」以外に書かなくて大丈夫です。

  - type: textarea
    id: why
    attributes:
      label: "なぜ直したいか（必須）"
      description: "困っていることを、そのまま書いてください"
      placeholder: "例：検索しても結果が出ず、主要機能が使えない"
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: "何が起きたか（必須）"
      description: "期待される挙動と実際の挙動を書いてください"
      value: |
        - 期待される挙動：
        - 実際の挙動：
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順（必須）"
      description: "同じことが起きる手順を書いてください"
      placeholder: |
        1. ○○画面を開く
        2. △△ボタンをクリック
        3. エラーが発生
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "スクリーンショット / GIF / 動画 / Figma"
      description: "画面キャプチャがあると調査が早くなります。画像はこの枠にドラッグ&ドロップできます。"
      value: |
        - 画面のURL：
        - Figma：
        - 端末 / OS / ブラウザ：
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "追加情報"
      placeholder: |
        - 発生頻度：
        - 影響範囲：
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > ここは技術の人が書く欄です。わからなければ空のままで大丈夫です。

        <details>
        <summary>📝 記入例</summary>

        1. `next/image` コンポーネントに変更する
        2. AVIF/WebP形式を有効化する

        **該当ファイルパス:**
        - `src/components/Hero.tsx` (L45-L60)

        </details>

  - type: textarea
    id: how
    attributes:
      label: "やり方の指定（任意・技術向け）"
      description: "実装の指定がある場合のみ。わからない場合は空でOKです"
      placeholder: |
        - 該当ファイルパス：
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 「こうなっとれば終わり」をチェックリストで書いてください。

        <details>
        <summary>📝 記入例</summary>

        - [ ] 問題が発生していた画面で正しく表示される
        - [ ] 修正前のエラーが再現しなくなっている
        - [ ] 他の画面が崩れていない
        - [ ] iOS・Androidどちらでも正常に動作する

        </details>

  - type: textarea
    id: complete
    attributes:
      label: "完成の定義（必須）"
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: else
    attributes:
      label: "その他"
      description: "共有しておきたいことがあれば"
    validations:
      required: false