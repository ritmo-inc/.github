name: "バグ修正・機能改修 (PBI)"
description: "今あるものが壊れとる・使いにくい時に使います"
labels: ["bug"]
type: "Bug"
projects: ["ritmo-inc/2"]
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 分かる範囲で埋めてもらえれば十分です。技術的な話は「やり方の指定」以外に書かなくて大丈夫です。

  - type: textarea
    id: why
    attributes:
      label: "なぜ直したいか（必須）"
      description: "困っていることを、そのまま書いてください"
      placeholder: "例：検索しても結果が出ず、主要機能が使えない"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > ここから3つは「どう壊れとるか」を整理する欄です。分かる範囲で大丈夫です。

        <details>
        <summary>📝 記入例</summary>

        **再現手順**
        1. 馬の一覧画面を開く
        2. 検索窓に「はなこ」と入れて検索する
        3. 画面が真っ白になる

        **現状（実際の動作）**
        - 画面が真っ白になり、何も表示されない

        **期待動作**
        - 「はなこ」の検索結果が一覧で表示される

        **発生頻度・環境**
        - ほぼ毎回発生 / iPhone 15・Safari / 自分だけでなく同じチームの2人でも確認

        </details>

  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順（必須）"
      description: "同じことが起きる手順を書いてください"
      placeholder: |
        1. ○○画面を開く
        2. △△ボタンを押す
        3. エラーが出る
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "現状（実際の動作）（必須）"
      description: "今、実際にどうなっているかを書いてください"
      placeholder: "例：エラーが出て画面が真っ白になり、何も表示されない"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期待動作（必須）"
      description: "本来どうなってほしいかを書いてください"
      placeholder: "例：「はなこ」の検索結果が一覧で表示される"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "発生頻度（必須）"
      description: "同じ手順でどのくらいの確率で起きますか？"
      options:
        - 毎回
        - ほぼ毎回（8割以上）
        - 時々（半分くらい）
        - まれ（1〜2回）
        - 不明
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "端末 / OS / ブラウザ / 影響範囲（必須）"
      description: "起きている環境と、どのくらい広い範囲で起きているかを書いてください。分からない項目は「わからない」で大丈夫です。"
      placeholder: |
        - 端末 / OS / ブラウザ：
        - 影響範囲（自分だけ？ 他の人でも発生？）：
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "スクリーンショット / GIF / 動画 / Figma"
      description: "画面キャプチャやURLがあると調査が早くなります。画像はこの枠にドラッグ&ドロップできます。"
      placeholder: |
        - 画面のURL：
        - Figma：
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > ここは技術の人が書く欄です。わからなければ空のままで大丈夫です。

        <details>
        <summary>📝 記入例</summary>

        1. `next/image` コンポーネントに変更する
        2. AVIF/WebP形式を有効化する

        **該当ファイルパス:**
        - `src/components/Hero.tsx` (L45-L60)

        </details>

  - type: textarea
    id: how
    attributes:
      label: "やり方の指定（任意・技術向け）"
      description: "実装の指定がある場合のみ。わからない場合は空でOKです"
      placeholder: |
        - 該当ファイルパス：
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 「こうなっとれば終わり」をチェックリストで書いてください。

        <details>
        <summary>📝 記入例</summary>

        - [ ] 問題が発生していた画面で正しく表示される
        - [ ] 修正前のエラーが再現しなくなっている
        - [ ] 他の画面が崩れていない
        - [ ] iOS・Androidどちらでも正常に動作する

        </details>

  - type: textarea
    id: complete
    attributes:
      label: "完成の定義（必須）"
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: else
    attributes:
      label: "その他"
      description: "共有しておきたいことがあれば"
    validations:
      required: false
