name: "📝 作業の依頼（システムを変えない頼み事）"
description: "調べ物・設定・資料作り・申請などコードを変えない作業の時に使います"
labels: []
type: "Task"
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 何を・どんな形で受け取りたいかを書いてください。形（表・画面の写真・ファイル・URL）が決まっとればやり直しが減ります。
        > システムの動きを変える話は「バグ修正・機能改修」か「新規開発・機能改修」を使ってください。

  - type: textarea
    id: request
    attributes:
      label: "依頼内容（必須）"
      description: "やってほしいことと受け取りたい形を書いてください"
      placeholder: |
        [やってほしいこと] + [受け取りたい形]

        （記入例）
        問い合わせフォームの送信先を新しいアドレスに変えてほしい。テスト送信が届いた画面の写真をこの Issue に貼ってほしい
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "背景（任意）"
      description: "なぜ必要か・誰からの依頼か"
      placeholder: "（記入例）担当者が変わった。前のアドレスはもう誰も見ていない"
    validations:
      required: false

  - type: textarea
    id: done-definition
    attributes:
      label: "完了の定義（必須）"
      description: "「終わった」と言える条件を見て分かる事実で書いてください"
      placeholder: |
        - [ ] 新しいアドレスにテスト送信が届いた
        - [ ] 届いた画面の写真がこの Issue にある
    validations:
      required: true

  - type: input
    id: due
    attributes:
      label: "期限（任意）"
      placeholder: "2026-11-07"
    validations:
      required: false
