name: "新規開発・機能改修 (PBI)"
description: "新しく作りたい・今あるものを良くしたい時に使います"
labels: ["feature"]
projects: ["ritmo-inc/2"]
body:
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 分かる範囲で埋めてもらえれば十分です。技術的な話は「やり方の指定」以外に書かなくて大丈夫です。

  - type: textarea
    id: why
    attributes:
      label: "なぜやるのか（必須）"
      description: "困っていること・やりたいことを、そのまま書いてください"
      placeholder: "例：ユーザーが商品を比較できないため、コンバージョンが低下している"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "スクリーンショット / GIF / 動画 / Figma"
      description: "デザインや参考画像があれば添付してください。画像はこの枠にドラッグ&ドロップできます。"
      value: |
        - 画面のURL：
        - Figma：
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > ここは技術の人が書く欄です。わからなければ空のままで大丈夫です。

        <details>
        <summary>📝 記入例</summary>

        1. 商品比較ページのコンポーネントを作成
        2. 最大4商品まで比較可能にする
        3. スペック項目ごとに並べて表示

        **該当ファイルパス:**
        - `src/pages/compare.tsx` (新規作成)
        - `src/components/CompareTable.tsx` (新規作成)

        </details>

  - type: textarea
    id: how
    attributes:
      label: "やり方の指定（任意・技術向け）"
      description: "実装の指定がある場合のみ。わからない場合は空でOKです"
      placeholder: |
        - 該当ファイルパス：
        1. ○○コンポーネントを作成
        2. △△APIを呼び出す
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > 「こうなっとれば終わり」をチェックリストで書いてください。

        <details>
        <summary>📝 記入例</summary>

        - [ ] 最大4商品を選択して比較できる
        - [ ] スペック項目が並べて表示される
        - [ ] 各商品から直接カートに追加できる
        - [ ] モバイルでも快適に操作できる
        - [ ] デザインがFigmaと一致している

        </details>

  - type: textarea
    id: complete
    attributes:
      label: "完成の定義（必須）"
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: else
    attributes:
      label: "その他"
      description: "共有しておきたいことがあれば"
    validations:
      required: false